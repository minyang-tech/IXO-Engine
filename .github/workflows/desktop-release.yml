name: Desktop Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: release/windows/**

  linux-native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot
      - run: npm ci
      - run: npm run build:renderer
      - name: Build native Linux packages
        run: npx electron-builder --linux AppImage deb --x64 --config.directories.output=release/linux
      - name: Verify native Linux artifacts
        run: |
          test -n "$(find release/linux -maxdepth 1 -name '*.AppImage' -print -quit)"
          test -n "$(find release/linux -maxdepth 1 -name '*.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-native-release
          path: |
            release/linux/*.AppImage
            release/linux/*.deb
